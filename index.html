<script type="module">

import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInAnonymously,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// ===== NASTAVITVE =====
const ADMIN_EMAIL='robi.filipsek@gmail.com';
const firebaseConfig={
  apiKey:"AIzaSyDbRouSg-8ANONlm7bmTh6BSDSx6nf2sxQ",
  authDomain:"kava-inel.firebaseapp.com",
  projectId:"kava-inel",
  storageBucket:"kava-inel.firebasestorage.app",
  messagingSenderId:"675983563038",
  appId:"1:675983563038:web:f16fe25249691cfd54110f"
};
const DEFAULT_TEAM=["Filipšek","Fidler","Pirnat","Oprešnik","Govedić","Fendre","Šetina","Vrtačnik","Gračner","Rihter"];
const DEF={active:true,openHour:6,closeHour:18,dailyLimit:3,weeklyLimit:15,workDays:[1,2,3,4,5],notice:'',cols:'auto',inviteTime:'12:00',
  webhook:"https://default3caae3ec12124a678d46afe2847c45.a8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/806a9b79b01b4219bc66ed4d449ffbfd/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hTxW5wgDGp3I9TXnX6fSdLQ2r7sBnumVkzROnPYLIig",
  msgInvite:"☕ **{ime}** vas vabi na kavo! Zberemo se ob **{cas}**!",msgRound:"☕ Danes časti **{ime}**.",notifyRound:false};

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const p=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const today=()=>iso(new Date());
function weekB(){const d=new Date(),k=d.getDay(),m=new Date(d);m.setDate(d.getDate()+(k===0?-6:1-k));const s=new Date(m);s.setDate(m.getDate()+6);return[iso(m),iso(s)];}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ===== IKONA / PWA =====
const CUP=`<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#0f291e'/><g transform='translate(256 256) scale(.95) translate(-286 -276)'><g fill='none' stroke-linecap='round'><path d='M214 172c-18-20 18-36 0-58M282 172c-18-20 18-36 0-58' stroke='#fff' stroke-width='20' opacity='.6'/><path d='M348 258h20a44 44 0 0 1 0 88h-28' stroke='#10b981' stroke-width='26'/><path d='M170 438h156' stroke='#fff' stroke-width='20'/></g><path d='M148 218h200v82a100 100 0 0 1-200 0z' fill='#34d399'/></g></svg>`;
const ICON='data:image/svg+xml,'+encodeURIComponent(CUP);
(function(){
  const l=document.createElement('link');l.rel='icon';l.href=ICON;document.head.appendChild(l);
  const img=new Image();
  img.onload=()=>{try{
    const png=s=>{const c=document.createElement('canvas');c.width=c.height=s;c.getContext('2d').drawImage(img,0,0,s,s);return c.toDataURL('image/png')};
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href=png(180);document.head.appendChild(a);
    const m={name:'Odmor za kavo',short_name:'Kava',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0f291e',theme_color:'#0f291e',icons:[{src:png(512),sizes:'512x512',type:'image/png',purpose:'any'}]};
    const mk=document.createElement('link');mk.rel='manifest';mk.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(mk);
  }catch(e){}};
  img.src=ICON;
})();
let installEv=null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;render()});
addEventListener('appinstalled',()=>{installEv=null;render()});

// ===== STANJE =====
let user=null,tab='main',me='',presence=[],unsubs=[],loaded=false,rolling=false,hist=[];
let CFG={...DEF};
function norm(s){
  s.team=s.team?.length?s.team:[...DEFAULT_TEAM];
  for(const k of['counts','absent','paid','unav'])s[k]=s[k]||{};
  s.team.forEach(n=>{s.counts[n]=s.counts[n]||0;s.absent[n]=!!s.absent[n];s.paid[n]=!!s.paid[n];s.unav[n]=!!s.unav[n]});
  s.log=s.log||[];s.todayPayer=s.todayPayer||null;s.day=s.day||'';s.ver=s.ver||0;
  s.idx=Math.min(Math.max(s.idx||0,0),Math.max(s.team.length-1,0));
  return s;
}
let S=norm({});

// ===== LOGIKA VRSTE (iz stare aplikacije) =====
const valid=(s,n)=>!s.absent[n]&&!s.unav[n];
function fair(s,unpaidOnly){
  const c=[];
  for(let i=0;i<s.team.length;i++){const ix=(s.idx+i)%s.team.length,n=s.team[ix];
    if(!valid(s,n)||(unpaidOnly&&s.paid[n]))continue;c.push({ix,o:i,c:s.counts[n]||0});}
  if(!c.length)return -1;
  c.sort((a,b)=>a.c-b.c||a.o-b.o);return c[0].ix;
}
const nextIx=s=>{const i=fair(s,true);return i<0?fair(s,false):i};
const nextName=s=>{const i=nextIx(s);return i<0?null:s.team[i]};
function adv(s){const i=nextIx(s);if(i>=0)s.idx=i}
function checkRound(s){
  const av=s.team.filter(n=>valid(s,n));
  if(av.length&&av.every(n=>s.paid[n])){
    s.team.forEach(n=>s.paid[n]=false);
    s.team.forEach(n=>{if(s.absent[n])s.counts[n]++}); // odsotni ne zaostajajo
  }
}
function pay(s,who,type,by,inTurn=true){
  const d=new Date();
  s.counts[who]++;s.paid[who]=true;s.todayPayer=who;s.unav[who]=false;
  s.log.push({d:today(),t:`${p(d.getHours())}:${p(d.getMinutes())}`,who,type,by});
  if(s.log.length>100)s.log.splice(0,s.log.length-100);
  checkRound(s);if(inTurn)adv(s);
}

// ===== FIRESTORE (transakcije, da sočasna dejanja ne povozijo drug drugega) =====
async function mutate(fn,noHist){
  const ref=doc(db,'kava','state');let before,after;
  await runTransaction(db,async tx=>{
    const sn=await tx.get(ref);const cur=norm(sn.exists()?sn.data():{});
    before=structuredClone(cur);fn(cur);norm(cur);cur.ver++;tx.set(ref,cur);after=cur;
  });
  if(!noHist){hist.push({before,ver:after.ver});if(hist.length>20)hist.shift()}
  S=after;render();
}
async function run(fn,ok,after){
  try{await mutate(fn);if(ok)toast(ok);after&&after()}
  catch(e){console.error(e);toast(e.message==='none'?'Ni dostopnih članov za kavo.':'Shranjevanje ni uspelo (preverite Firestore pravila).','err')}
}
function rollover(){
  if(!loaded||rolling||S.day===today())return;
  rolling=true;
  mutate(s=>{s.team.forEach(n=>s.unav[n]=false);s.todayPayer=null;s.day=today()},true).catch(e=>console.warn(e)).finally(()=>rolling=false);
}
function startListeners(){
  stop();
  unsubs.push(onSnapshot(doc(db,'kava','state'),sn=>{S=norm(sn.exists()?sn.data():{});loaded=true;rollover();render()},
    e=>{console.error(e);toast('Podatkov ni mogoče naložiti. Preverite Firestore pravila.','err')}));
  unsubs.push(onSnapshot(doc(db,'settings','main'),sn=>{CFG={...DEF,...(sn.exists()?sn.data():{})};render()},e=>console.warn(e)));
  if(isAdmin())unsubs.push(onSnapshot(collection(db,'presence'),sn=>{presence=sn.docs.map(d=>({id:d.id,...d.data()}));if(tab==='admin')render()},e=>console.warn(e)));
}
function stop(){unsubs.forEach(u=>u());unsubs=[];loaded=false;presence=[]}
async function beat(){
  if(!user)return;
  try{await setDoc(doc(db,'presence',user.uid),{uid:user.uid,name:who(),member:me,email:user.email||'',isAnonymous:!!user.isAnonymous,lastSeen:serverTimestamp()},{merge:true})}catch(e){}
}
setInterval(()=>{if(document.visibilityState==='visible'){beat();rollover();render()}},60000);

// ===== POMOŽNE =====
const isAdmin=()=>!!user&&!user.isAnonymous&&(user.email||'').toLowerCase()===ADMIN_EMAIL&&user.emailVerified!==false;
const who=()=>me&&S.team.includes(me)?me:(user?.displayName||user?.email||'Neznano');
const dayN=()=>S.log.filter(l=>l.d===today()).length;
const weekN=()=>{const[a,b]=weekB();return S.log.filter(l=>l.d>=a&&l.d<=b).length};
function closedReason(){
  if(!CFG.active)return 'Aplikacija je trenutno izklopljena.';
  const d=new Date();
  if(!CFG.workDays.includes(d.getDay()))return 'Danes ni delovni dan.';
  if(d.getHours()<CFG.openHour||d.getHours()>=CFG.closeHour)return `Kavni odmor je mogoč med ${p(CFG.openHour)}:00 in ${p(CFG.closeHour)}:00.`;
  return null;
}
function gate(quota){
  if(isAdmin())return null;
  const c=closedReason();if(c)return c;
  if(quota){
    if(dayN()>=CFG.dailyLimit)return 'Dnevna kvota rund je dosežena.';
    if(weekN()>=CFG.weeklyLimit)return 'Tedenska kvota rund je dosežena.';
  }
  return null;
}
function toast(msg,type='ok'){
  const c={ok:'bg-emerald-800',err:'bg-red-800',info:'bg-slate-800'}[type]||'bg-slate-800';
  document.getElementById('toast').innerHTML=`<div class="${c} text-white text-sm p-4 rounded-2xl shadow-2xl">${esc(msg)}</div>`;
  clearTimeout(toast.t);toast.t=setTimeout(()=>document.getElementById('toast').innerHTML='',4000);
}
let ansRes=null;
function ask(title,text,ok='Potrdi',inner=''){
  return new Promise(res=>{
    ansRes=res;
    document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60"><div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <h3 class="font-bold text-lg">${esc(title)}</h3><p class="text-sm text-slate-600 mt-2">${esc(text)}</p>${inner}
      <div class="flex gap-3 mt-5"><button onclick="A.ans(false)" class="flex-1 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-sm font-semibold">Prekliči</button>
      <button onclick="A.ans(true)" class="flex-1 py-2.5 rounded-xl bg-kg text-white text-sm font-bold">${esc(ok)}</button></div></div></div>`;
  });
}
async function teams(msg){
  if(!CFG.webhook||!CFG.webhook.trim())return null;
  try{
    const r=await fetch(CFG.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'message',attachments:[{contentType:'application/vnd.microsoft.card.adaptive',contentUrl:null,content:{$schema:'http://adaptivecards.io/schemas/adaptive-card.json',type:'AdaptiveCard',version:'1.2',body:[{type:'TextBlock',text:msg,wrap:true}]}}]})});
    return r.ok;
  }catch(e){console.error('Teams:',e);return false}
}
const fill=(t,o)=>t.replace(/{ime}/g,o.ime||'').replace(/{cas}/g,o.cas||'').replace(/{datum}/g,o.datum||'');

// ===== DEJANJA =====
const A=window.A={
  ans(v){document.getElementById('modal').innerHTML='';ansRes&&ansRes(v);ansRes=null},
  tab(t){tab=t;render();scrollTo({top:0})},
  async confirm(){
    const g=gate(true);if(g)return toast(g,'err');
    const n=nextName(S);if(!n)return toast('Ni dostopnih članov za kavo.','err');
    if(!await ask('Potrditev runde',`Ali potrjuješ, da bo ${n} danes dal za kavo?`))return;
    let w=n;
    run(s=>{w=nextName(s);if(!w)throw new Error('none');pay(s,w,'turn',who())},'Runda potrjena.',()=>{if(CFG.notifyRound)teams(fill(CFG.msgRound,{ime:w}))});
  },
  async cant(){
    const g=gate();if(g)return toast(g,'err');
    const n=nextName(S);if(!n)return toast('Ni dostopnih članov za kavo.','err');
    if(!await ask('Danes ne more',`Označim, da ${n} danes ne more dati za kavo?`))return;
    run(s=>{const w=nextName(s);if(!w)throw new Error('none');s.unav[w]=true;s.paid[w]=false;checkRound(s);adv(s)},'Zabeleženo, naslednji je na vrsti.');
  },
  async sponsor(){
    if(!me||!S.team.includes(me))return A.pick();
    const g=gate(true);if(g)return toast(g,'err');
    if(!await ask('Častim danes',`Potrjuješ, da ${me} danes prostovoljno časti kavo?`))return;
    run(s=>{const nx=nextName(s);pay(s,me,'sponsor',me,nx===me)},'Hvala za častitko!',()=>{if(CFG.notifyRound)teams(fill(CFG.msgRound,{ime:me}))});
  },
  async invite(){
    const g=gate();if(g)return toast(g,'err');
    const inner=`<input id="invTime" type="time" value="${esc(CFG.inviteTime)}" class="inp mt-4 text-center">`;
    if(!await ask('Povabi na kavo (Teams)','Ob kateri uri gremo na kavo?','Pošlji vabilo',inner))return;
    const time=(document.getElementById('invTime')||{}).value||CFG.inviteTime;
    // vabilo velja tudi kot potrditev runde, a samo če runda danes še ni potrjena
    const will=!S.todayPayer&&nextName(S);
    if(will){const q=gate(true);if(q)return toast(q,'err')}
    const send=async(note)=>{
      const r=await teams(fill(CFG.msgInvite,{ime:who(),cas:time,datum:today()}));
      toast(r===null?'Teams webhook ni nastavljen.':r?`Vabilo za ob ${time} je poslano na Teams.${note}`:'Vabila na Teams ni bilo mogoče poslati.',r?'ok':'err');
    };
    if(!will)return send('');
    let w=null;
    run(s=>{w=nextName(s);if(!w)throw new Error('none');pay(s,w,'invite',who())},'',()=>send(` Runda (${w}) potrjena.`));
  },
  undo(){
    const h=hist.pop();if(!h)return toast('Ni dejanj za razveljavitev.','info');
    runTransaction(db,async tx=>{
      const ref=doc(db,'kava','state'),sn=await tx.get(ref);
      if((sn.exists()?sn.data().ver:0)!==h.ver)throw new Error('changed');
      const b=structuredClone(h.before);b.ver=h.ver+1;tx.set(ref,b);S=b;
    }).then(()=>{render();toast('Stanje je povrnjeno.')})
      .catch(e=>toast(e.message==='changed'?'Stanje se je medtem spremenilo – razveljavitev ni več mogoča.':'Razveljavitev ni uspela.','err'));
  },
  toggleUnav(i){run(s=>{const n=s.team[i];s.unav[n]=!s.unav[n];checkRound(s);adv(s)})},
  pick(){
    document.getElementById('modal').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60"><div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <h3 class="font-bold text-lg">Kdo si?</h3><p class="text-sm text-slate-600 mt-1 mb-3">Izberi svoje ime s seznama ekipe.</p>
      <select id="pickSel" class="inp">${S.team.map(n=>`<option ${n===me?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <div class="flex gap-3 mt-5"><button onclick="A.ans(false)" class="flex-1 py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-sm font-semibold">Pozneje</button>
      <button onclick="A.setMe()" class="flex-1 py-2.5 rounded-xl bg-kg text-white text-sm font-bold">Shrani</button></div></div></div>`;
  },
  setMe(){me=document.getElementById('pickSel').value;ls.set('kava_member_'+user.uid,me);A.ans(true);beat();render()},
  // --- skrbnik ---
  async saveCfg(){
    const g=id=>document.getElementById(id),n=id=>parseInt(g(id).value,10);
    const c={active:g('s_active').checked,openHour:n('s_open'),closeHour:n('s_close'),dailyLimit:n('s_day'),weeklyLimit:n('s_week'),
      workDays:[1,2,3,4,5,6,0].filter(d=>g('wd'+d).checked),notice:g('s_notice').value.trim(),cols:g('s_cols').value,inviteTime:g('s_time').value||'12:00',
      webhook:g('t_url').value.trim(),msgInvite:g('t_inv').value.trim(),msgRound:g('t_rnd').value.trim(),notifyRound:g('t_notify').checked};
    if(![c.openHour,c.closeHour,c.dailyLimit,c.weeklyLimit].every(Number.isInteger)||c.openHour<0||c.closeHour>24||c.openHour>=c.closeHour||c.dailyLimit<1||c.weeklyLimit<1)
      return toast('Preverite ure obratovanja in kvote.','err');
    try{await setDoc(doc(db,'settings','main'),c);toast('Nastavitve shranjene.')}catch(e){console.error(e);toast('Shranjevanje ni uspelo (Firestore pravila).','err')}
  },
  async testTeams(){const r=await teams('✅ Testno sporočilo iz aplikacije Odmor za kavo.');toast(r===null?'Webhook ni nastavljen.':r?'Testno sporočilo poslano.':'Pošiljanje ni uspelo.',r?'ok':'err')},
  count(i,d){run(s=>{const n=s.team[i];s.counts[n]=Math.max(0,s.counts[n]+d)})},
  setNext(i){run(s=>{s.idx=i},`${S.team[i]} je nastavljen kot naslednji.`)},
  togglePaid(i){run(s=>{const n=s.team[i];s.paid[n]=!s.paid[n]})},
  toggleAbs(i){run(s=>{const n=s.team[i];s.absent[n]=!s.absent[n];checkRound(s);adv(s)})},
  move(i,d){const j=i+d;if(j<0||j>=S.team.length)return;run(s=>{[s.team[i],s.team[j]]=[s.team[j],s.team[i]]})},
  rename(i){
    const nn=document.getElementById('rn'+i).value.trim(),old=S.team[i];
    if(!nn||nn===old||S.team.includes(nn))return;
    run(s=>{s.team[i]=nn;for(const k of['counts','absent','paid','unav']){s[k][nn]=s[k][old];delete s[k][old]}
      if(s.todayPayer===old)s.todayPayer=nn;s.log.forEach(l=>{if(l.who===old)l.who=nn})},'Ime spremenjeno.');
    if(me===old){me=nn;ls.set('kava_member_'+user.uid,me)}
  },
  async remove(i){
    if(S.team.length<2)return toast('V ekipi mora ostati vsaj en član.','err');
    const n=S.team[i];if(!await ask('Odstrani člana',`Odstranim člana ${n}?`,'Odstrani'))return;
    run(s=>{s.team=s.team.filter(x=>x!==n);for(const k of['counts','absent','paid','unav'])delete s[k][n];if(s.todayPayer===n)s.todayPayer=null},'Član odstranjen.');
  },
  add(){
    const el=document.getElementById('newName'),n=el.value.trim();
    if(!n||S.team.includes(n))return toast('Vnesite unikatno ime.','err');
    run(s=>{s.team.push(n)},'Član dodan.');el.value='';
  },
  async delUser(id){try{await deleteDoc(doc(db,'presence',id))}catch(e){toast('Brisanje ni uspelo.','err')}},
  async google(){
    const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
    try{await signInWithPopup(auth,pr)}catch(e){
      if(e.code==='auth/popup-blocked')return signInWithRedirect(auth,pr);
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Prijava ni uspela ('+(e.code||'napaka')+')','err');
    }
  },
  async guest(){try{await signInAnonymously(auth)}catch(e){toast('Gostujoča prijava ni uspela. Preverite, ali je v Firebase omogočen "Anonymous".','err')}},
  async logout(){
    try{if(user)await setDoc(doc(db,'presence',user.uid),{lastSeen:0},{merge:true})}catch(e){}
    await signOut(auth);
  },
  async install(){
    if(installEv){installEv.prompt();await installEv.userChoice;installEv=null;render()}
    else toast(isIOS?"Tapni 'Deli' v Safariju in izberi 'Dodaj na začetni zaslon'.":"V meniju brskalnika izberi 'Namesti aplikacijo'.",'info');
  },
  contact(){location.href='mailto:'+['robi.filipsek','gmail.com'].join('@')+'?subject='+encodeURIComponent('Odmor za kavo')}
};

// ===== PRIKAZ =====
const card='bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5';
const lbl='block text-xs font-semibold text-slate-600';
function loginView(){
  return `<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-kd via-kg to-ka"><div class="${card} max-w-sm w-full text-center">
    <img src="${ICON}" class="w-16 h-16 rounded-2xl mx-auto mb-3 shadow"><h1 class="font-bold text-xl">Odmor za kavo</h1>
    <p class="text-sm text-slate-500 mt-1 mb-5">Prijavite se z Google računom ali nadaljujte kot gost.</p>
    <div class="flex flex-col gap-3"><button onclick="A.google()" class="py-2.5 rounded-xl bg-white border border-slate-300 font-semibold text-sm">Prijava z Google</button>
    <button onclick="A.guest()" class="py-2.5 rounded-xl bg-kg text-white font-semibold text-sm">Prijava kot gost</button></div></div></div>`;
}
function header(){
  const showInst=!standalone()&&(installEv||isIOS);
  return `<header class="bg-kd text-white sticky top-0 z-30 shadow-md"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="A.tab('main')"><img src="${ICON}" class="w-10 h-10 rounded-xl ring-2 ring-white/20"><span class="font-bold text-lg">Odmor za kavo</span></div>
    <div class="flex items-center gap-2 text-xs">${showInst?`<button onclick="A.install()" class="px-3 py-2 rounded-lg bg-kg border border-ka/50">📲 <span class="hidden sm:inline">Namesti</span></button>`:''}
    <span class="hidden md:block text-slate-300">${esc(who())}</span>
    <button onclick="A.logout()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">Odjava</button></div></div></header>`;
}
function hero(){
  const dq=dayN(),wq=weekN();
  return `<section class="bg-gradient-to-r from-kd via-kg to-ka text-white py-6 px-4"><div class="max-w-4xl mx-auto">
    <h1 class="text-2xl sm:text-3xl font-extrabold">Kdo časti kavo?</h1>
    <p class="text-slate-300 text-sm mt-1">Kavni odmor: <strong>${p(CFG.openHour)}:00 do ${p(CFG.closeHour)}:00</strong>, ${new Date().toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long'})}.</p>
    <div class="grid grid-cols-2 gap-3 text-xs mt-4">
      <div class="bg-slate-900/50 border border-white/10 rounded-xl p-3"><span class="text-slate-400">Dnevna kvota</span><div class="text-sm font-bold ${dq>=CFG.dailyLimit?'text-amber-400':'text-emerald-300'}">${dq} / ${CFG.dailyLimit} rund</div></div>
      <div class="bg-slate-900/50 border border-white/10 rounded-xl p-3"><span class="text-slate-400">Tedenska kvota</span><div class="text-sm font-bold ${wq>=CFG.weeklyLimit?'text-amber-400':'text-emerald-300'}">${wq} / ${CFG.weeklyLimit} rund</div></div>
    </div></div></section>`;
}
function viewMain(){
  const n=nextName(S),cr=closedReason();
  const cols=CFG.cols==='auto'?(S.team.length%2?3:2):+CFG.cols;
  const cards=S.team.map((name,i)=>{
    const isPayer=S.todayPayer===name,isNext=!S.todayPayer&&name===n;
    let cls='border-slate-200 bg-white',st='⏳ Čaka na vrsto';
    if(S.absent[name]){cls='border-slate-200 bg-slate-100 opacity-60';st='🌴 Dopust / odsoten'}
    else if(S.unav[name]){cls='border-red-200 bg-red-50';st='❌ Danes ne more'}
    else if(isPayer){cls='border-emerald-400 bg-emerald-50';st='⭐ Časti danes'}
    else if(isNext){cls='border-amber-400 bg-amber-50 ring-2 ring-amber-300';st='👉 Na vrsti'}
    else if(S.paid[name]){cls='border-emerald-200 bg-emerald-50/50';st='✅ Že dal'}
    return `<div class="rounded-xl border p-3 ${cls}"><div class="flex items-center justify-between gap-1"><strong class="text-sm truncate ${name===me?'underline':''}">${esc(name)}</strong>
      <span class="text-[11px] font-bold text-kg bg-emerald-100 border border-emerald-300 rounded-full px-2 py-0.5 whitespace-nowrap">☕ ${S.counts[name]||0}</span></div>
      <div class="flex justify-end mt-1"><button onclick="A.toggleUnav(${i})" class="text-[11px] px-2 py-1 rounded-md bg-white border border-slate-300">${S.unav[name]?'❌ Odsoten':'✔️ Prisoten'}</button></div>
      <div class="text-[11px] text-slate-500 mt-1">${st}</div></div>`;
  }).join('');
  return `${cr?`<div class="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-sm">⚠️ ${esc(cr)}</div>`:''}
  <div class="${card} text-center mb-4">
    <div class="text-xs text-slate-500">${S.todayPayer?'⭐ Danes potrjeno časti:':'Na vrsti da časti:'}</div>
    <div class="text-3xl font-extrabold my-1 ${S.todayPayer?'text-emerald-600':'text-slate-900'}">${esc(S.todayPayer||n||'-')}</div>
    <div class="grid sm:grid-cols-2 gap-2 mt-3">
      <button onclick="A.confirm()" class="b bg-emerald-600">✅ Potrjujem rundo</button>
      <button onclick="A.cant()" class="b bg-red-600">✕ Danes ne more</button>
      <button onclick="A.sponsor()" class="b bg-amber-500">⭐ Jaz častim (izven vrstnega reda)</button>
      <button onclick="A.invite()" class="b bg-indigo-600">⏰ Povabi na kavo (Teams)</button>
      <button onclick="A.undo()" class="b bg-slate-600 sm:col-span-2">↩️ Razveljavi (Undo)</button></div></div>
  <div class="mg" style="--c:${cols}">${cards}</div>
  <div class="text-xs text-slate-500 mt-4 flex items-center justify-between">
    <span>Prijavljen kot: <strong>${esc(me&&S.team.includes(me)?me:'—')}</strong> <a href="#" class="underline text-kg" onclick="A.pick();return false">(zamenjaj)</a></span>
    <span>${loaded?'✅ Sinhronizirano':'⏳ Nalagam …'}</span></div>`;
}
const TYPE={turn:'po vrsti',sponsor:'prostovoljno',invite:'vabilo',manual:'ročno'};
function viewLog(){
  const rows=[...S.log].reverse().slice(0,60).map(l=>`<div class="flex items-center justify-between px-3 py-2 text-sm"><span><strong>${esc(l.who)}</strong> <span class="text-slate-500 text-xs">(${TYPE[l.type]||l.type})</span></span><span class="text-xs font-mono text-slate-500">${esc(l.d)} ${esc(l.t)}</span></div>`).join('');
  return `<div class="${card}"><h2 class="font-bold text-lg mb-1">Zgodovina rund</h2><p class="text-xs text-slate-500 mb-3">Zadnjih 60 potrjenih rund.</p>
    <div class="divide-y divide-slate-100 border border-slate-200 rounded-xl">${rows||'<div class="p-4 text-sm text-slate-500">Še ni zabeleženih rund.</div>'}</div></div>`;
}
function viewInfo(){
  const dn=['Ned','Pon','Tor','Sre','Čet','Pet','Sob'];
  return `<div class="${card} space-y-3 text-sm text-slate-600"><h2 class="font-bold text-lg text-slate-900">Pravila & info</h2>
    <p>☕ <strong>Vrsta:</strong> na vrsti je tisti, ki je v tekočem krogu plačal najmanj rund; pri izenačenju velja vrstni red ekipe.</p>
    <p>⭐ <strong>Prostovoljna častitka:</strong> kdor časti izven vrste, ne preskoči nikogar – pravi na vrsti ostane naslednji.</p>
    <p>❌ <strong>Danes ne more:</strong> oseba je tisti dan preskočena; naslednji dan je spet na voljo.</p>
    <p>🌴 <strong>Dopust:</strong> skrbnik označi dolgotrajno odsotnost; za zamujene kroge se odsotnim samodejno prišteje runda.</p>
    <p>📊 <strong>Kvote:</strong> največ ${CFG.dailyLimit} rund na dan in ${CFG.weeklyLimit} na teden.</p>
    <p>🕒 <strong>Delovni čas:</strong> ${CFG.workDays.map(d=>dn[d]).join(', ')} (${p(CFG.openHour)}:00 – ${p(CFG.closeHour)}:00)</p>
    <p><a href="#" class="underline text-kg font-semibold" onclick="A.contact();return false">Pošlji sporočilo skrbniku</a></p></div>`;
}
function viewAdmin(){
  const ck=(id,v,t)=>`<label class="flex items-center gap-2 text-sm"><input type="checkbox" id="${id}" ${v?'checked':''} class="w-4 h-4 accent-emerald-600">${t}</label>`;
  const days=[[1,'Pon'],[2,'Tor'],[3,'Sre'],[4,'Čet'],[5,'Pet'],[6,'Sob'],[0,'Ned']].map(([d,t])=>ck('wd'+d,CFG.workDays.includes(d),t)).join('');
  const team=S.team.map((n,i)=>`<div class="p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-2 text-xs">
    <div class="flex gap-1"><input id="rn${i}" value="${esc(n)}" class="inp"><button onclick="A.rename(${i})" class="px-2 rounded-lg bg-blue-500 text-white">✏️</button><button onclick="A.remove(${i})" class="px-2 rounded-lg bg-red-600 text-white">🗑️</button></div>
    <div class="flex items-center justify-between"><span class="font-semibold">Skupaj rund:</span><span class="flex items-center gap-1"><button onclick="A.count(${i},-1)" class="px-2 py-1 rounded bg-slate-300">➖</button><strong class="w-6 text-center">${S.counts[n]}</strong><button onclick="A.count(${i},1)" class="px-2 py-1 rounded bg-slate-300">➕</button></span></div>
    <div class="flex flex-wrap gap-1"><button onclick="A.setNext(${i})" class="px-2 py-1 rounded bg-blue-500 text-white">👉 Naslednji</button>
    <button onclick="A.togglePaid(${i})" class="px-2 py-1 rounded text-white ${S.paid[n]?'bg-emerald-600':'bg-slate-500'}">${S.paid[n]?'✅':'⭕'} Že dal</button>
    <button onclick="A.toggleAbs(${i})" class="px-2 py-1 rounded text-white ${S.absent[n]?'bg-red-600':'bg-slate-500'}">${S.absent[n]?'🌴':'⭕'} Dopust</button>
    <button onclick="A.move(${i},-1)" class="px-2 py-1 rounded bg-slate-300">⬆️</button><button onclick="A.move(${i},1)" class="px-2 py-1 rounded bg-slate-300">⬇️</button></div></div>`).join('');
  const now=Date.now();
  const users=[...presence].sort((a,b)=>(b.lastSeen?.toMillis?.()||0)-(a.lastSeen?.toMillis?.()||0)).map(u=>{
    const ms=u.lastSeen?.toMillis?.()||0,on=now-ms<=180000;
    return `<div class="flex items-center justify-between gap-2 px-3 py-2 text-xs"><span class="min-w-0"><span class="inline-block w-2 h-2 rounded-full mr-1 ${on?'bg-emerald-500':'bg-slate-300'}"></span><strong>${esc(u.member||u.name||'Brez imena')}</strong> <span class="text-slate-500">${u.isAnonymous?'Gost':esc(u.email)}</span><div class="text-slate-400">Zadnjič: ${ms?new Date(ms).toLocaleString('sl-SI'):'-'}</div></span>
    <button onclick="A.delUser('${esc(u.id)}')" class="px-2 py-1 rounded bg-red-100 text-red-700 border border-red-300">Izbriši</button></div>`;
  }).join('');
  const online=presence.filter(u=>now-(u.lastSeen?.toMillis?.()||0)<=180000).length;
  return `<div class="space-y-4">
  <div class="${card} space-y-3"><h2 class="font-bold text-lg">⚙️ Obratovanje in kvote</h2>
    ${ck('s_active',CFG.active,'Aplikacija je aktivna')}
    <div class="grid sm:grid-cols-4 gap-3"><label class="${lbl}">Začetek (ura)<input id="s_open" type="number" min="0" max="23" value="${CFG.openHour}" class="inp"></label>
      <label class="${lbl}">Konec (ura)<input id="s_close" type="number" min="1" max="24" value="${CFG.closeHour}" class="inp"></label>
      <label class="${lbl}">Dnevna kvota (rund)<input id="s_day" type="number" min="1" value="${CFG.dailyLimit}" class="inp"></label>
      <label class="${lbl}">Tedenska kvota (rund)<input id="s_week" type="number" min="1" value="${CFG.weeklyLimit}" class="inp"></label></div>
    <div class="flex flex-wrap gap-x-4 gap-y-1">${days}</div>
    <div class="grid sm:grid-cols-3 gap-3"><label class="${lbl} sm:col-span-2">Obvestilo za uporabnike<input id="s_notice" maxlength="160" value="${esc(CFG.notice)}" class="inp"></label>
      <label class="${lbl}">Privzeta ura vabila<input id="s_time" type="time" value="${esc(CFG.inviteTime)}" class="inp"></label></div>
    <label class="${lbl}">Število stolpcev ekipe<select id="s_cols" class="inp">${['auto','2','3'].map(v=>`<option value="${v}" ${CFG.cols===v?'selected':''}>${v==='auto'?'Samodejno':v}</option>`).join('')}</select></label>
    <h3 class="font-bold pt-2">🔔 Teams</h3>
    <label class="${lbl}">Power Automate Webhook URL<input id="t_url" value="${esc(CFG.webhook)}" class="inp"></label>
    <label class="${lbl}">Sporočilo vabila ({ime}, {cas}, {datum})<input id="t_inv" value="${esc(CFG.msgInvite)}" class="inp"></label>
    <label class="${lbl}">Sporočilo ob potrjeni rundi ({ime})<input id="t_rnd" value="${esc(CFG.msgRound)}" class="inp"></label>
    ${ck('t_notify',CFG.notifyRound,'Ob potrditvi runde pošlji obvestilo na Teams')}
    <div class="flex gap-2"><button onclick="A.saveCfg()" class="b bg-kg">💾 Shrani nastavitve</button><button onclick="A.testTeams()" class="b bg-indigo-600">Pošlji test na Teams</button></div></div>
  <div class="${card} space-y-3"><h2 class="font-bold text-lg">👥 Ekipa</h2><div class="grid sm:grid-cols-2 gap-2">${team}</div>
    <div class="flex gap-2"><input id="newName" placeholder="Ime novega sodelavca" class="inp"><button onclick="A.add()" class="b bg-emerald-600 whitespace-nowrap">➕ Dodaj</button></div></div>
  <div class="${card} space-y-3"><h2 class="font-bold text-lg">🟢 Uporabniki <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">${online} aktivnih</span></h2>
    <div class="max-h-80 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl">${users||'<div class="p-4 text-xs text-slate-500">Ni zapisov.</div>'}</div></div></div>`;
}
function render(){
  const app=document.getElementById('app');
  if(!user){app.innerHTML=loginView();return}
  if(tab==='admin'&&document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)&&app.contains(document.activeElement))return; // ne motimo vnosa
  const tabs=[['main','☕ Kava'],['log','🕘 Zgodovina'],['info','ℹ️ Info'],...(isAdmin()?[['admin','🛡️ Skrbnik']]:[])];
  const body={main:viewMain,log:viewLog,info:viewInfo,admin:isAdmin()?viewAdmin:viewMain}[tab]();
  app.innerHTML=`${header()}${hero()}<main class="max-w-4xl mx-auto px-4 py-5">
    ${CFG.notice?`<div class="mb-4 p-3 rounded-xl bg-slate-100 border border-slate-300 text-sm">ℹ️ ${esc(CFG.notice)}</div>`:''}
    <nav class="flex gap-2 mb-5">${tabs.map(([id,t])=>`<button onclick="A.tab('${id}')" class="flex-1 px-2 py-2.5 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 ${tab===id?'bg-kg text-white':'bg-white text-slate-600'}">${t}</button>`).join('')}</nav>
    ${body}</main>`;
}

// ===== PRIJAVA =====
onAuthStateChanged(auth,u=>{
  user=u;
  if(u){
    me=ls.get('kava_member_'+u.uid)||'';
    startListeners();beat();
    setTimeout(()=>{if(user&&(!me||!S.team.includes(me)))A.pick()},1500);
  }else{stop();me='';tab='main'}
  render();
});
render();
</script>
</body>
</html>
