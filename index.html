    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #f8fafc;
            --text: #94a3b8;
            --text-bright: #f1f5f9;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            max-width: 580px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
        }


        .cup-icon { width: 1em; height: 1em; display: inline-block; flex-shrink: 0; vertical-align: -0.16em; color: var(--text); }
        .cup-icon.lg { width: 26px; height: 26px; vertical-align: middle; }
        .cup-icon.sm { width: 17px; height: 14px; color: var(--accent); vertical-align: middle; overflow: visible; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--text-bright);
            font-size: 20px;
            margin: 0;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .header-info {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-bright);
            font-weight: 600;
        }

        .status-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .status-box span {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            display: block;
        }

        .status-box strong {
            font-size: 26px;
            color: var(--text-bright);
            display: block;
            margin: 8px 0 10px 0;
            font-weight: 900;
        }

        .next-person-info {
            font-size: 12px;
            color: var(--text);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 12px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-confirm { background: var(--accent); color: #0f172a; }
        .btn-confirm:hover { background: #34d399; }

        .btn-cant { background: #dc2626; color: white; }
        .btn-cant:hover { background: #ef4444; }
        .btn-cant svg { flex-shrink: 0; }

        .btn-sponsor { background: var(--info); color: white; grid-column: span 2; }
        .btn-sponsor:hover { background: #60a5fa; }

        .btn-invite { background: #8b5cf6; color: white; grid-column: span 2; }
        .btn-invite:hover { background: #a78bfa; }

        .btn-undo { background: #334155; color: var(--text-bright); grid-column: span 2; }
        .btn-undo:hover { background: #475569; }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(var(--member-cols, 2), 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .member-card {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 60px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .member-card.is-next { background: rgba(16, 185, 129, 0.05); border-color: var(--accent); }
        .member-card.is-paid { background: rgba(59, 130, 246, 0.05); border-color: var(--info); }
        .member-card.is-unavailable { background: rgba(239, 68, 68, 0.05); border-color: var(--danger); opacity: 0.7; }
        .member-card.is-absent { background: rgba(15, 23, 42, 0.6); border-style: dashed; opacity: 0.4; filter: grayscale(80%); }

        .member-name {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-bright);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-meta {
            font-size: 11px;
            color: var(--text);
            margin-top: 4px;
        }

        .absent-toggle-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .absent-toggle-btn:hover {
            background: var(--card-border);
            color: var(--text-bright);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            padding-top: 15px;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info span { font-weight: 700; color: var(--text-bright); }
        .link-btn { color: var(--info); cursor: pointer; text-decoration: underline; margin-left: 5px; }

        .icon-btn {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-bright);
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--card-border); }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            max-width: 820px;
            width: 95%;
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-bright);
            box-sizing: border-box;
        }

        .modal h2 { margin-top: 0; color: var(--text-bright); font-size: 18px; }
        
        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-bright);
            font-size: 13px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
            font-weight: 600;
        }

        label { font-size: 12px; font-weight: 700; color: var(--text); }

        .admin-members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .admin-member-row {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-member-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .admin-member-name-input { 
            flex: 1; 
            margin: 0 !important; 
            padding: 4px 8px; 
            font-size: 12px; 
            height: 30px;
        }

        .admin-controls-inline { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            flex-wrap: wrap; 
        }

        .mini-btn {
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .admin-section {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .round-badge {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 3px 10px;
            min-width: 38px;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }

        .install-btn {
            display: none;
        }
        .install-btn.visible {
            display: flex;
        }

        /* Ozek zaslon (telefon): manj robov, mreža vedno 2 stolpca za simetrijo */
        @media (max-width: 480px) {
            body { padding: 12px 6px; }
            .container { padding: 16px; border-radius: 18px; }
            h1 { font-size: 17px; }
            .action-buttons { gap: 8px; }
            .btn { padding: 11px; font-size: 12px; }
            .members-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px;
            }
            .member-card { padding: 10px 12px; min-height: 54px; }
            .member-name { font-size: 12.5px; }
            .footer { font-size: 11px; }
        }

        @media (max-width: 360px) {
            .members-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>

    <linearGradient id="cupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <symbol id="icon-cup" viewBox="120 100 325 360">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M214 172c-18-20 18-36 0-58M282 172c-18-20 18-36 0-58" stroke="currentColor" stroke-width="20" opacity=".55"/>
        <path d="M348 258h20a44 44 0 0 1 0 88h-28" stroke="#10b981" stroke-width="26"/>
        <path d="M170 438h156" stroke="currentColor" stroke-width="20"/>
      </g>
      <path d="M148 218h200v82a100 100 0 0 1-200 0z" fill="url(#cupGrad)"/>
    </symbol>
    <symbol id="icon-cup-sm" viewBox="138 206 298 252">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M348 258h20a44 44 0 0 1 0 88h-28" stroke="currentColor" stroke-width="30"/>
        <path d="M170 438h156" stroke="currentColor" stroke-width="26"/>
      </g>
      <path d="M148 218h200v82a100 100 0 0 1-200 0z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="overlay" id="loginOverlay" style="display: flex;">
    <div class="modal" style="text-align: center; max-width: 400px;">
        <h2><svg class="cup-icon lg"><use href="#icon-cup"/></svg> Kdo se prijavlja?</h2>
        <p style="font-size: 13px; color: var(--text);">Izberi svoje ime za sodelovanje v aplikaciji:</p>
        <select id="loginSelect"></select>
        <button class="btn btn-confirm" style="width: 100%; margin-top: 10px;" onclick="handleLogin()">Prijava v aplikacijo</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1><svg class="cup-icon lg"><use href="#icon-cup"/></svg> Odmor za kavo</h1>
        <div class="header-info">
            <span id="dateBadge" class="badge">-</span>
            <span id="syncStatus" class="badge">Nalagam...</span>
        </div>
    </div>

    <div class="status-box">
        <span id="statusSubtitle">Na vrsti da časti:</span>
        <strong id="currentPersonName">-</strong>
        <div class="action-buttons">
            <button class="btn btn-confirm" onclick="confirmMyCoffee()">✅ Potrjujem rundo</button>
            <button class="btn btn-cant" onclick="cantGiveCoffee()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg> Danes ne morem</button>
            <button class="btn btn-sponsor" onclick="sponsorCoffee()">⭐ Jaz častim danes (izven vrstnega reda)</button>
            <button class="btn btn-invite" onclick="inviteToCoffee()">⏰ Povabi na kavo (Teams)</button>
            <button class="btn btn-undo" onclick="undoLastAction()">↩️ Razveljavi (Undo)</button>
        </div>
    </div>

    <div class="members-grid" id="membersGrid"></div>

    <div class="footer">
        <div class="user-info">
            Prijavljen: <span id="loggedInUserDisplay">-</span>
            <span class="link-btn" onclick="openLoginModal()">(Zamenjaj)</span>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="icon-btn install-btn" id="installBtn" onclick="handleInstallClick()" title="Namesti aplikacijo na telefon">📲</button>
            <button class="icon-btn" onclick="syncWithCloud(null, true)" title="Osveži podatke s strežnika">🔄</button>
            <button class="icon-btn" id="settingsBtn" onclick="openAdminModal()" title="Nastavitve" style="display: none;">⚙️</button>
        </div>
    </div>
</div>

<div class="overlay" id="adminModal">
    <div class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin:0;">⚙️ Skrbniške nastavitve</h2>
            <span style="cursor: pointer; font-size: 18px; font-weight: bold; color:var(--text);" onclick="closeAdminModal()">✕</span>
        </div>

        <div id="settingsContent">
            <h3 style="font-size: 13px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 1px;">Urejanje ekipe</h3>
            <div id="adminMembersList" class="admin-members-grid"></div>

            <div style="display: flex; gap: 6px; margin-bottom: 20px;" id="addMemberBox">
                <input type="text" id="newMemberNameInput" placeholder="Ime novega sodelavca" style="margin:0; flex:1;">
                <button class="btn btn-confirm" style="padding: 10px 15px;" onclick="addMember()">➕ Dodaj</button>
            </div>

            <h3 style="font-size: 13px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 1px;">🔲 Postavitev mreže</h3>
            <div class="admin-section">
                <label for="gridColumnsSelect">Število stolpcev prikaza sodelavcev:</label>
                <select id="gridColumnsSelect">
                    <option value="auto">Samodejno (glede na sodo/liho število oseb)</option>
                    <option value="2">Vedno 2 stolpca</option>
                    <option value="3">Vedno 3 stolpci</option>
                </select>
            </div>

            <h3 style="font-size: 13px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 1px;">🔔 Teams Webhook in sporočilo</h3>
            <div class="admin-section">
                <label for="teamsWebhookInput">Power Automate Webhook URL:</label>
                <input type="text" id="teamsWebhookInput" placeholder="https://...">



                <label for="teamsMsgInviteInput">Sporočilo ob vabilu na kavo (⏰):</label>
                <input type="text" id="teamsMsgInviteInput">
            </div>

            <button class="btn btn-confirm" style="width: 100%; margin-top: 5px; padding: 14px; font-size: 14px;" onclick="saveAllAdminChanges()">💾 Shrani vse spremembe</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, getDoc, runTransaction, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_TEAM = ["Filipšek", "Fidler", "Pirnat", "Oprešnik", "Govedić", "Fendre", "Šetina", "Vrtačnik", "Gračner", "Rihter"];

    // --- FIREBASE / FIRESTORE KONFIGURACIJA ---
    const firebaseConfig = {
        apiKey: "AIzaSyDbRouSg-8ANONlm7bmTh6BSDSx6nf2sxQ",
        authDomain: "kava-inel.firebaseapp.com",
        projectId: "kava-inel",
        storageBucket: "kava-inel.firebasestorage.app",
        messagingSenderId: "675983563038",
        appId: "1:675983563038:web:f16fe25249691cfd54110f"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);
    const CLOUD_REF = doc(db, 'coffeeApp', 'main');

    const ADMIN_PIN = "1234";

    // Teams Power Automate webhook – uporablja isti mehanizem kot izvirna aplikacija Kava.
    // URL lahko skrbnik kadarkoli spremeni v Nastavitvah.
    let teamsWebhookUrl = "https://default3caae3ec12124a678d46afe2847c45.a8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/806a9b79b01b4219bc66ed4d449ffbfd/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hTxW5wgDGp3I9TXnX6fSdLQ2r7sBnumVkzROnPYLIig";
    let teamsMsgInvite = "☕ **{ime}** vas vabi na kavo! Zberemo se ob **{cas}**!";

    let team = [...DEFAULT_TEAM];
    let counts = {};
    let absent = {};
    let currentRoundPaid = {};
    let dailyUnavailable = {};
    let todayPayer = null;
    let currentIndex = 0;
    let lastRotationDate = "";

    let loggedInUser = "";
    let appTimestamp = 0;
    let syncTimer = null;
    let historyStack = [];
    let gridColumnsSetting = "auto";
    let cloudUnsubscribe = null;
    let cloudWriteBusy = false;

    function sendTeamsNotification(message) {
        if (!teamsWebhookUrl || teamsWebhookUrl.trim() === "") return Promise.resolve(false);
        const payload = {
            type: "message",
            attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.2",
                    body: [{ type: "TextBlock", text: message, wrap: true }]
                }
            }]
        };
        return fetch(teamsWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(r => r.ok).catch(err => { console.error("Napaka Teams:", err); return false; });
    }

    function normalizeState(data = {}) {
        if (Array.isArray(data.team) && data.team.length) team = data.team;
        if (data.counts) counts = data.counts;
        if (data.absent) absent = data.absent;
        if (data.currentRoundPaid) currentRoundPaid = data.currentRoundPaid;
        if (data.dailyUnavailable) dailyUnavailable = data.dailyUnavailable;
        if (data.todayPayer !== undefined) todayPayer = data.todayPayer;
        if (Number.isInteger(data.currentIndex)) currentIndex = data.currentIndex;
        if (data.lastRotationDate) lastRotationDate = data.lastRotationDate;
        if (data.teamsWebhookUrl !== undefined) teamsWebhookUrl = data.teamsWebhookUrl;
        if (data.teamsMsgInvite !== undefined) teamsMsgInvite = data.teamsMsgInvite;
        if (data.gridColumnsSetting !== undefined) gridColumnsSetting = data.gridColumnsSetting;
        appTimestamp = data.timestamp || Date.now();
        clampIndex();
        ensureMemberFields();
    }

    function ensureMemberFields() {
        team.forEach(name => {
            if (!(name in counts)) counts[name] = 0;
            if (!(name in absent)) absent[name] = false;
            if (!(name in currentRoundPaid)) currentRoundPaid[name] = false;
            if (!(name in dailyUnavailable)) dailyUnavailable[name] = false;
        });
    }

    function statePayload() {
        return { team, counts, absent, currentRoundPaid, dailyUnavailable, todayPayer, currentIndex, lastRotationDate,
            timestamp: Date.now(), teamsWebhookUrl, teamsMsgInvite, gridColumnsSetting, updatedAt: serverTimestamp() };
    }

    function saveStateSnapshot() {
        historyStack.push({ team:[...team], counts:{...counts}, absent:{...absent}, currentRoundPaid:{...currentRoundPaid},
            dailyUnavailable:{...dailyUnavailable}, todayPayer, currentIndex, lastRotationDate });
        if (historyStack.length > 20) historyStack.shift();
    }

    function undoLastAction() {
        if (!historyStack.length) { alert("Ni prejšnjih dejanj za povrnitev."); return; }
        const p = historyStack.pop();
        team=p.team; counts=p.counts; absent=p.absent; currentRoundPaid=p.currentRoundPaid;
        dailyUnavailable=p.dailyUnavailable; todayPayer=p.todayPayer||null; currentIndex=p.currentIndex; lastRotationDate=p.lastRotationDate;
        clampIndex(); renderUI(); pushToCloud(true); alert("Stanje je bilo uspešno povrnjeno!");
    }

    function loadLocalStorage() {
        try {
            const saved = localStorage.getItem('COFFEE_APP_STATE_FIREBASE');
            if (saved) normalizeState(JSON.parse(saved));
            if (!loggedInUser) loggedInUser = localStorage.getItem('COFFEE_APP_USER') || '';
        } catch(e) { console.warn(e); }
        ensureMemberFields(); clampIndex();
    }

    function saveLocalStorage() {
        try {
            localStorage.setItem('COFFEE_APP_STATE_FIREBASE', JSON.stringify({team,counts,absent,currentRoundPaid,dailyUnavailable,todayPayer,currentIndex,lastRotationDate,teamsWebhookUrl,teamsMsgInvite,loggedInUser,gridColumnsSetting,timestamp:appTimestamp}));
            localStorage.setItem('COFFEE_APP_USER', loggedInUser || '');
        } catch(e) {}
    }

    function subscribeCloud() {
        if (cloudUnsubscribe) cloudUnsubscribe();
        const syncStatus=document.getElementById('syncStatus');
        if (syncStatus) syncStatus.innerText='⏳ Sinhronizacija...';
        cloudUnsubscribe = onSnapshot(CLOUD_REF, snap => {
            if (snap.exists()) {
                normalizeState(snap.data());
                saveLocalStorage();
            } else {
                ensureMemberFields();
                pushToCloud(true);
            }
            setupLoginDropdown(); checkDateRollover(); renderUI();
            if (syncStatus) syncStatus.innerText='✅ Sinhronizirano';
        }, err => {
            console.error('Firestore:',err);
            if (syncStatus) syncStatus.innerText='⚠️ Lokalno';
            renderUI();
        });
    }

    async function fetchCloudRecord() {
        const snap = await getDoc(CLOUD_REF);
        return snap.exists() ? snap.data() : null;
    }

    function syncWithCloud(onComplete, forceServer=false) {
        const syncStatus=document.getElementById('syncStatus');
        if (syncStatus && forceServer) syncStatus.innerText='⏳ Nalagam...';
        fetchCloudRecord().then(data=>{
            if(data) normalizeState(data);
            setupLoginDropdown(); checkDateRollover(); renderUI(); saveLocalStorage();
            if(syncStatus) syncStatus.innerText='✅ Sinhronizirano';
            if(onComplete) onComplete(true);
        }).catch(e=>{
            console.error(e); if(syncStatus) syncStatus.innerText='⚠️ Brez povezave';
            setupLoginDropdown(); renderUI(); if(onComplete) onComplete(false);
        });
    }

    async function pushToCloud(immediate=false, onComplete=null) {
        if (syncTimer) clearTimeout(syncTimer);
        const write = async () => {
            if (cloudWriteBusy) return;
            cloudWriteBusy=true;
            try {
                appTimestamp=Date.now(); clampIndex(); ensureMemberFields(); saveLocalStorage();
                await setDoc(CLOUD_REF, statePayload(), {merge:true});
                const syncStatus=document.getElementById('syncStatus'); if(syncStatus) syncStatus.innerText='✅ Sinhronizirano';
                if(onComplete) onComplete(true);
            } catch(e) {
                console.error('Firestore zapis:',e); const syncStatus=document.getElementById('syncStatus'); if(syncStatus) syncStatus.innerText='⚠️ Napaka';
                if(onComplete) onComplete(false);
            } finally { cloudWriteBusy=false; }
        };
        if (immediate) return write();
        syncTimer=setTimeout(write,200);
    }

    async function performCloudAction(actionFn, onComplete, mergeCounts=true) {
        try {
            const result = await fetchCloudRecord();
            if (mergeCounts && result?.counts) {
                for (const key in result.counts) counts[key]=Math.max(counts[key]||0,result.counts[key]||0);
            }
            actionFn();
            await pushToCloud(true, onComplete);
        } catch(e) {
            actionFn();
            await pushToCloud(true, onComplete);
        }
    }

    function init() {
        loadLocalStorage();
        setupLoginDropdown();
        if (!loggedInUser) document.getElementById('loginOverlay').style.display='flex';
        else { document.getElementById('loggedInUserDisplay').innerText=loggedInUser; document.getElementById('loginOverlay').style.display='none'; }
        subscribeCloud();
        checkDateRollover();
        renderUI();
    }

    function confirmMyCoffee() {
        const active = todayPayer || getNextEligiblePerson();
        if (active === "-") {
            alert("Trenutno ni dostopnih članov za kavo.");
            return;
        }

        if (confirm(`Ali potrjuješ, da bo ${active} danes ob 12:00 dal za kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                counts[active] = (counts[active] || 0) + 1;
                currentRoundPaid[active] = true;
                todayPayer = active;
                dailyUnavailable[active] = false; 

                checkRoundCompletion();
                advanceToNextEligiblePerson();

                renderUI();
            }, (success) => {
                if (success) {
                    alert("Runda uspešno potrjena in sinhronizirana!");
                }
            });
        }
    }

    function cantGiveCoffee() {
        const active = getNextEligiblePerson();
        if (active === "-") {
            alert("Trenutno ni dostopnih članov za kavo.");
            return;
        }

        if (confirm(`Označi, da ${active} danes ne more dati za kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                dailyUnavailable[active] = true; 
                currentRoundPaid[active] = false;
                
                checkRoundCompletion();
                advanceToNextEligiblePerson(); 
                renderUI();
            }, (success) => {
                const newActive = getNextEligiblePerson();
                if (success) {
                    alert("Zabeleženo, naslednji je na vrsti.");
                }
            });
        }
    }

    function sponsorCoffee() {
        if (!loggedInUser) {
            alert("Najprej se prijavi!");
            return;
        }
        if (confirm(`Ali potrjuješ, da ${loggedInUser} danes prostovoljno časti kavo?`)) {
            performCloudAction(() => {
                saveStateSnapshot();
                // Kdo bi moral biti danes na vrsti PRED to častitko
                const rightfulNext = getNextEligiblePerson();
                const isInTurn = (loggedInUser === rightfulNext);

                counts[loggedInUser] = (counts[loggedInUser] || 0) + 1;
                currentRoundPaid[loggedInUser] = true;
                todayPayer = loggedInUser;
                dailyUnavailable[loggedInUser] = false;
                
                checkRoundCompletion();

                // Vrsto pomaknemo naprej samo, če je častil tisti, ki je bil dejansko na vrsti.
                // Če je nekdo počastil izven vrstnega reda, ostane oseba, ki bi morala
                // danes dati za kavo, še vedno naslednja na vrsti.
                if (isInTurn) {
                    advanceToNextEligiblePerson();
                }

                renderUI();
            }, (success) => {
                if (success) {
                    alert("Hvala za častitko in sinhronizacijo!");
                }
            });
        }
    }

    function inviteToCoffee() {
        const time = prompt("Ob kateri uri gremo danes na kavo?", "12:00");
        if (!time || !time.trim()) return;
        const timeStr = time.trim();
        const inviter = loggedInUser || "Neznano";

        // Vabilo na kavo velja tudi kot potrditev runde - a samo, če runda danes še ni bila potrjena.
        const roundAlreadyConfirmed = !!todayPayer;
        const active = roundAlreadyConfirmed ? null : getNextEligiblePerson();
        const shouldConfirm = !roundAlreadyConfirmed && active && active !== "-";

        const sendInvite = () => {
            sendTeamsNotification(teamsMsgInvite.replace(/{ime}/g, inviter).replace(/{cas}/g, timeStr));
        };

        if (!shouldConfirm) {
            sendInvite();
            alert(`Vabilo za ob ${timeStr} je bilo poslano na Teams!`);
            return;
        }

        performCloudAction(() => {
            saveStateSnapshot();
            counts[active] = (counts[active] || 0) + 1;
            currentRoundPaid[active] = true;
            todayPayer = active;
            dailyUnavailable[active] = false;

            checkRoundCompletion();
            advanceToNextEligiblePerson();

            renderUI();
        }, (success) => {
            sendInvite();
            alert(success
                ? `Vabilo za ob ${timeStr} je poslano na Teams, runda (${active}) pa potrjena!`
                : `Vabilo za ob ${timeStr} je poslano na Teams. Rundo (${active}) sem zabeležil lokalno - sinhronizacija ni uspela.`);
        });
    }

    function toggleAbsence(name) {
        performCloudAction(() => {
            saveStateSnapshot();
            dailyUnavailable[name] = !dailyUnavailable[name];

            checkRoundCompletion();
            advanceToNextEligiblePerson();
            renderUI();
        });
    }

    function getEffectiveColumnCount() {
        if (gridColumnsSetting === "2" || gridColumnsSetting === "3") {
            return parseInt(gridColumnsSetting, 10);
        }
        // "auto": sodo število oseb -> 2 stolpca, liho -> 3 stolpci (praviloma se lepše izide)
        return (team.length % 2 === 0) ? 2 : 3;
    }

    function renderUI() {
        clampIndex();
        const nextPerson = getNextEligiblePerson();
        
        const subtitleEl = document.getElementById('statusSubtitle');
        const nameEl = document.getElementById('currentPersonName');

        if (todayPayer) {
            subtitleEl.innerText = "⭐ Danes potrjeno časti:";
            nameEl.innerText = todayPayer;
            nameEl.style.color = "var(--accent)";
        } else {
            subtitleEl.innerText = "Na vrsti da časti:";
            nameEl.innerText = nextPerson;
            nameEl.style.color = "var(--text-bright)";
        }

        document.getElementById('settingsBtn').style.display = (loggedInUser === "Filipšek") ? 'flex' : 'none';

        const grid = document.getElementById('membersGrid');
        grid.innerHTML = '';
        grid.style.setProperty('--member-cols', getEffectiveColumnCount());

        team.forEach(name => {
            const isTodayPayer = (todayPayer && name === todayPayer);
            const isNext = (!todayPayer && name === nextPerson);
            const isTodayPaid = currentRoundPaid[name];
            const isAbs = absent[name];
            const isUnav = dailyUnavailable[name];

            let cardClass = "member-card";
            let statusText = "⏳ Čaka na vrsto";
            
            if (isAbs) {
                cardClass += " is-absent";
                statusText = "🌴 Dopust / Odsoten";
            } else if (isUnav) {
                cardClass += " is-unavailable";
                statusText = "❌ Danes ne more";
            } else if (isTodayPayer) {
                cardClass += " is-paid";
                statusText = "⭐ Časti danes";
            } else if (isNext) {
                cardClass += " is-next";
                statusText = "👉 Na vrsti";
            } else if (isTodayPaid) {
                cardClass += " is-paid";
                statusText = "✅ Že dal";
            }

            const roundCount = counts[name] || 0;

            const card = document.createElement('div');
            card.className = cardClass;
            card.innerHTML = `
                <div class="member-name">
                    <span>${name}</span>
                    <span class="round-badge" title="Skupaj plačanih/pogoščenih rund"><svg class="cup-icon sm"><use href="#icon-cup-sm"/></svg> ${roundCount}</span>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
                    <button class="absent-toggle-btn" onclick="toggleAbsence('${name}')" title="Preklopi odsotnost">
                        ${dailyUnavailable[name] ? '❌ Odsoten' : '✔️ Prisoten'}
                    </button>
                </div>
                <div class="member-meta">${statusText}</div>
            `;
            grid.appendChild(card);
        });
    }

    function openAdminModal() {
        if (loggedInUser !== "Filipšek") return;
        const pin = prompt("🔒 Vnesi admin PIN:");
        if (pin === null) return;
        if (pin !== ADMIN_PIN) {
            alert("Napačen PIN.");
            return;
        }
        document.getElementById('adminModal').style.display = 'flex';
        document.getElementById('teamsWebhookInput').value = teamsWebhookUrl || '';
        document.getElementById('teamsMsgInviteInput').value = teamsMsgInvite || '';
        document.getElementById('gridColumnsSelect').value = gridColumnsSetting || 'auto';
        renderAdminMembers();
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
        renderUI();
    }

    function renderAdminMembers() {
        const list = document.getElementById('adminMembersList');
        if (!list) return;
        list.innerHTML = '';

        team.forEach((name, index) => {
            const isAbs = absent[name];
            const isPaid = currentRoundPaid[name];
            const userCount = counts[name] || 0;

            const row = document.createElement('div');
            row.className = 'admin-member-row';
            row.innerHTML = `
                <div class="admin-member-top">
                    <input type="text" class="admin-member-name-input" id="nameInput_${index}" value="${name}">
                    <button class="mini-btn" style="background:#3b82f6; color:white;" onclick="renameMember(${index})">✏️</button>
                    <button class="mini-btn" style="background:var(--danger); color:white;" onclick="removeMember('${name}')">🗑️</button>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
                    <span style="font-size: 11px; font-weight: bold; color: var(--text);">Skupaj rund:</span>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <button class="mini-btn" style="background:#334155; color:white;" onclick="changeCount('${name}', -1)">➖</button>
                        <span style="font-size: 12px; font-weight: bold; min-width: 20px; text-align: center; color: var(--text-bright);">${userCount}</span>
                        <button class="mini-btn" style="background:#334155; color:white;" onclick="changeCount('${name}', 1)">➕</button>
                    </div>
                </div>
                <div class="admin-controls-inline" style="justify-content: space-between; border-top: 1px solid var(--card-border); padding-top: 4px;">
                    <button class="mini-btn" style="background:#3b82f6; color:white;" onclick="setAsNext(${index})" title="Nastavi kot naslednjega">👉 Naslednji</button>
                    <button class="mini-btn" style="background: ${isPaid ? '#10b981' : '#334155'}; color:white;" onclick="togglePaid('${name}')">${isPaid ? '✅ Že dal' : '⭕ Že dal'}</button>
                    <button class="mini-btn" style="background: ${isAbs ? '#ef4444' : '#334155'}; color:white;" onclick="toggleAbsent('${name}')">${isAbs ? '🌴 Dopust' : '⭕ Dopust'}</button>
                    <button class="mini-btn" style="background:#334155; color:white;" onclick="moveMember(${index}, -1)">⬆️</button>
                    <button class="mini-btn" style="background:#334155; color:white;" onclick="moveMember(${index}, 1)">⬇️</button>
                </div>
            `;
            list.appendChild(row);
        });
    }

    function changeCount(name, amount) {
        saveStateSnapshot();
        counts[name] = Math.max(0, (counts[name] || 0) + amount);
        renderAdminMembers();
    }

    function setAsNext(index) {
        saveStateSnapshot();
        currentIndex = index;
        clampIndex();
        renderAdminMembers();
        alert(`Član ${team[index]} je nastavljen kot naslednji!`);
    }

    function renameMember(index) {
        const input = document.getElementById(`nameInput_${index}`);
        if (!input) return;
        const newName = input.value.trim();
        const oldName = team[index];
        if (!newName || newName === oldName || team.includes(newName)) return;

        saveStateSnapshot();
        team[index] = newName;
        counts[newName] = counts[oldName] || 0; delete counts[oldName];
        absent[newName] = absent[oldName] || false; delete absent[oldName];
        currentRoundPaid[newName] = currentRoundPaid[oldName] || false; delete currentRoundPaid[oldName];
        dailyUnavailable[newName] = dailyUnavailable[oldName] || false; delete dailyUnavailable[oldName];
        if (todayPayer === oldName) todayPayer = newName;

        setupLoginDropdown();
        renderAdminMembers();
    }

    function toggleAbsent(name) {
        saveStateSnapshot();
        absent[name] = !absent[name];
        renderAdminMembers();
    }

    function togglePaid(name) {
        saveStateSnapshot();
        currentRoundPaid[name] = !currentRoundPaid[name];
        renderAdminMembers();
    }

    function moveMember(index, direction) {
        const newIdx = index + direction;
        if (newIdx < 0 || newIdx >= team.length) return;
        saveStateSnapshot();
        const temp = team[index];
        team[index] = team[newIdx];
        team[newIdx] = temp;
        clampIndex();
        renderAdminMembers();
    }

    function addMember() {
        const input = document.getElementById('newMemberNameInput');
        const name = input.value.trim();
        if (!name || team.includes(name)) return;
        saveStateSnapshot();
        team.push(name);
        counts[name] = 0; absent[name] = false; currentRoundPaid[name] = false; dailyUnavailable[name] = false;
        input.value = '';
        clampIndex();
        setupLoginDropdown();
        renderAdminMembers();
    }

    function removeMember(name) {
        if (confirm(`Odstrani člana ${name}?`)) {
            saveStateSnapshot();
            team = team.filter(m => m !== name);
            delete counts[name]; delete absent[name]; delete currentRoundPaid[name]; delete dailyUnavailable[name];
            if (todayPayer === name) todayPayer = null;
            clampIndex();
            setupLoginDropdown();
            renderAdminMembers();
        }
    }

    function saveAllAdminChanges() {
        performCloudAction(() => {
            saveStateSnapshot();
            teamsWebhookUrl = document.getElementById('teamsWebhookInput').value.trim();
            teamsMsgInvite = document.getElementById('teamsMsgInviteInput').value.trim();
            gridColumnsSetting = document.getElementById('gridColumnsSelect').value;

            checkRoundCompletion();
            advanceToNextEligiblePerson();

            saveLocalStorage();
        }, (success) => {
            alert(success ? "Spremembe uspešno shranjene in sinhronizirane!" : "Spremembe shranjene lokalno.");
            closeAdminModal();
            renderUI();
        }, false); // mergeCounts=false: ročno spremenjeno št. rund (tudi navzdol) se ne sme prepisati nazaj navzgor
    }

    // --- NAMESTITEV NA ZAČETNI ZASLON (PWA) ---
    let deferredInstallPrompt = null;

    function isRunningStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const btn = document.getElementById('installBtn');
        if (btn && !isRunningStandalone()) btn.classList.add('visible');
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        const btn = document.getElementById('installBtn');
        if (btn) btn.classList.remove('visible');
    });

    function isIOS() {
        return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    }

    async function handleInstallClick() {
        if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            const btn = document.getElementById('installBtn');
            if (btn) btn.classList.remove('visible');
            return;
        }
        if (isIOS()) {
            alert("📲 Namestitev na iPhone/iPad:\n\n1. Tapni na ikono 'Deli' (kvadrat s puščico) v Safariju\n2. Izberi 'Dodaj na začetni zaslon'\n3. Potrdi z 'Dodaj'");
        } else {
            alert("📲 Za namestitev odpri meni brskalnika (⋮) in izberi 'Namesti aplikacijo' oz. 'Dodaj na začetni zaslon'.");
        }
    }

    function setupInstallButton() {
        const btn = document.getElementById('installBtn');
        if (!btn) return;
        if (isRunningStandalone()) {
            btn.classList.remove('visible');
        } else if (isIOS()) {
            // iOS ne podpira beforeinstallprompt, gumb prikažemo takoj z navodili
            btn.classList.add('visible');
        }
    }

    window.onload = function() {
        init();
        setupInstallButton();
    };
</script>
</body>
</html>
